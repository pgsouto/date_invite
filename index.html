<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgente!</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50 h-screen flex flex-col items-center justify-center overflow-hidden font-sans select-none">

    <div class="text-center p-6 max-w-sm w-full">
        <h1 class="text-3xl font-bold text-rose-600 mb-2">Lice, date hoje às 19h30 ou nada a ver?</h1>
        <p class="text-gray-600 text-sm mb-8">No baretta às 19h30.</p>
        
        <div class="flex justify-center items-center gap-6 w-full min-h-[60px]">
            <button id="sim" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform active:scale-95">
                Sim
            </button>
            
            <button id="nao" class="bg-rose-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all duration-75 ease-out">
                Não
            </button>
        </div>
    </div>

    <script>
        const btnSim = document.getElementById('sim');
        const btnNao = document.getElementById('nao');

        // Link oficial do clipe com o saxofone estourando no início
        const YOUTUBE_URL = "https://www.youtube.com/watch?v=izGwDsrQ1eQ";

        function desviar() {
            const padding = 30;
            
            const maxX = window.innerWidth - btnNao.offsetWidth - padding;
            const maxY = window.innerHeight - btnNao.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNao.style.position = "fixed";
            btnNao.style.left = `${randomX}px`;
            btnNao.style.top = `${randomY}px`;
        }

        // Listeners de fuga
        btnNao.addEventListener('mouseover', desviar);
        btnNao.addEventListener('touchstart', (e) => {
            e.preventDefault();
            desviar();
        });

        // O clique do sucesso 🎷
        btnSim.addEventListener('click', () => {
            window.open(YOUTUBE_URL, '_blank');
        });
    </script>
</body>
</html>
